"use strict";

// ---------------- Stockage local (IndexedDB) — remplace le stockage Claude.ai ----------------
// Cette app est un fichier autonome : les données restent uniquement sur cet appareil, dans ce navigateur.
const VITIGEST_DB_NAME = "vitigest-local-db";
const VITIGEST_STORE = "kv";
function vitigestOpenDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(VITIGEST_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(VITIGEST_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
window.storage = {
  async get(key) {
    const db = await vitigestOpenDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(VITIGEST_STORE, "readonly");
      const req = tx.objectStore(VITIGEST_STORE).get(key);
      req.onsuccess = () => resolve(req.result !== undefined ? { key, value: req.result, shared: false } : null);
      req.onerror = () => reject(req.error);
    });
  },
  async set(key, value) {
    const db = await vitigestOpenDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(VITIGEST_STORE, "readwrite");
      tx.objectStore(VITIGEST_STORE).put(value, key);
      tx.oncomplete = () => resolve({ key, value, shared: false });
      tx.onerror = () => reject(tx.error);
    });
  },
};

const APP_VERSION = "1.5";

// ---------------- Palette & style de base (carnet de cave) ----------------
const C = {
  ink: "#221723", panel: "#2C1E2E", panelLight: "#37263A",

};
const PIE_COLORS = [C.gold, C.olive, C.wine, C.blue, "#D7B76A", "#6E7F4A", "#B15A6A", "#7A97B8"];
const COMMANDE_COULEURS = { rouge: "#9C3F4E", jaune: "#8C6D1F", vert: "#3F6B2E", bleu: "#5C7FA6" };
const FONTS_HREF = "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap";
const STORAGE_KEY = "vitigest-data";

const CLIENT_TYPES = ["Épicerie", "Particulier", "Restaurant", "Grossiste", "Marché", "Export", "Autre"];
const QUALITES = ["Extra", "Standard", "Mauvaise"];
const PRODUIT_CATEGORIES = ["Raisin frais", "Produit dérivé", "Autre"];
const UNITES_FORMAT = ["kg", "L", "unité"];
const MODES_PAIEMENT = ["Virement", "Dépôt direct", "Chèque", "Comptant", "Carte", "Autre"];

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayISO = () => new Date().toISOString().slice(0, 10);
const yearOf = (d) => (d || "").slice(0, 4);
const toNum = (v) => (v === "" || v === null || v === undefined ? 0 : Number(v));
const fmtKg = (n) => `${(Math.round((toNum(n) + Number.EPSILON) * 10) / 10).toLocaleString("fr-FR")} kg`;
const fmtDate = (d) => (d ? new Date(d + "T00:00:00").toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" }) : "—");
const addDays = (dateStr, days) => { const d = new Date(dateStr + "T00:00:00"); d.setDate(d.getDate() + Number(days || 0)); return d.toISOString().slice(0, 10); };
const joursRestants = (dateStr) => (dateStr ? Math.ceil((new Date(dateStr + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / 86400000) : null);

const EMPTY_DATA = {
  cepages: [], produits: [], formats: [], formatPoids: [], tarifs: [],
  parametres: { devise: "CAD", delaiPaiementJours: 30, nomEntreprise: "", derniereExportation: null, stationDegresJours: "Lennoxville" },
  parcelles: [], plantsHistorique: [], recoltes: [], brixReadings: [], degreJours: [],
  pertes: [], transformations: [],
  clients: [], commandes: [], ventes: [], paiements: [],
};

function fmtMoney(n, devise) {
  try { return new Intl.NumberFormat("fr-CA", { style: "currency", currency: devise || "CAD" }).format(toNum(n)); }
  catch { return `${toNum(n).toFixed(2)} ${devise || ""}`; }
}

// ---------------- Calculs métier ----------------
function effectiveNombrePlants(parcelleId, dateStr, data) {
  const entries = data.plantsHistorique.filter((e) => e.parcelleId === parcelleId && e.date <= dateStr).sort((a, b) => (b.date < a.date ? -1 : 1));
  return entries.length ? Number(entries[0].nombrePlants) : null;
}

function findTarif(produitId, formatId, dateStr, data) {
  const candidats = data.tarifs.filter((t) => t.produitId === produitId && t.formatId === formatId && t.dateDebut <= dateStr && (!t.dateFin || t.dateFin >= dateStr));
  candidats.sort((a, b) => (b.dateDebut < a.dateDebut ? -1 : 1));
  return candidats[0] || null;
}

// Poids en kg par unité de format, pouvant varier par cépage et par année (grappes plus ou moins lâches selon la saison)
function resolvePoidsFormat(formatId, cepageId, dateStr, data) {
  const year = yearOf(dateStr);
  const format = data.formats.find((f) => f.id === formatId);
  const memeAnnee = data.formatPoids.filter((fp) => fp.formatId === formatId && fp.annee === year);
  const specifique = memeAnnee.find((fp) => fp.cepageId && fp.cepageId === cepageId);
  if (specifique) return toNum(specifique.poidsKgParUnite);
  const generique = memeAnnee.find((fp) => !fp.cepageId);
  if (generique) return toNum(generique.poidsKgParUnite);
  const passees = data.formatPoids.filter((fp) => fp.formatId === formatId && fp.annee <= year && (fp.cepageId === cepageId || !fp.cepageId)).sort((a, b) => (b.annee !== a.annee ? (b.annee < a.annee ? -1 : 1) : (a.cepageId ? -1 : 1)));
  if (passees.length) return toNum(passees[0].poidsKgParUnite);
  return format ? toNum(format.poidsKgParUnite) : 1;
}

function ligneKg(ligne, dateStr, data) { return toNum(ligne.quantiteFormat) * resolvePoidsFormat(ligne.formatId, ligne.cepageId, dateStr, data); }
function ligneMontant(ligne) { return toNum(ligne.quantiteFormat) * toNum(ligne.prixUnitaire); }
function venteTotalMontant(vente) { return vente.lignes.reduce((s, l) => s + ligneMontant(l), 0); }
function ventePaye(venteId, data) { return data.paiements.filter((p) => p.venteId === venteId).reduce((s, p) => s + toNum(p.montant), 0); }
function venteMontantDu(vente, data) { if (!vente.avecFacture) return 0; return Math.max(0, venteTotalMontant(vente) - ventePaye(vente.id, data)); }
function statutPaiementVente(vente, data) {
  if (!vente.avecFacture) return "Payée comptant";
  const total = venteTotalMontant(vente); const paye = ventePaye(vente.id, data);
  if (paye <= 0.005) return "Impayée";
  if (paye >= total - 0.01) return "Payée";
  return "Partielle";
}

function stockRaisinParCepage(data) {
  const m = {};
  const add = (cepageId, kg) => { if (!cepageId) return; m[cepageId] = (m[cepageId] || 0) + kg; };
  data.recoltes.forEach((r) => { if (r.qualite !== "Mauvaise") add(r.cepageId, toNum(r.quantiteKg)); });
  data.ventes.forEach((v) => v.lignes.forEach((l) => {
    const produit = data.produits.find((p) => p.id === l.produitId);
    if (produit && produit.categorie === "Raisin frais") add(l.cepageId, -ligneKg(l, v.date, data));
  }));
  data.pertes.forEach((p) => { if (p.type === "Raisin") add(p.cepageId, -toNum(p.quantiteKg)); });
  data.transformations.forEach((t) => add(t.cepageId, -toNum(t.kgRaisinConsomme)));
  return m;
}
function stockVirtuelParCepage(data) {
  const m = { ...stockRaisinParCepage(data) };
  data.commandes.filter((c) => c.statut === "En cours").forEach((c) => c.lignes.forEach((l) => {
    const produit = data.produits.find((p) => p.id === l.produitId);
    if (produit && produit.categorie === "Raisin frais" && l.cepageId) m[l.cepageId] = (m[l.cepageId] || 0) - ligneKg(l, c.date, data);
  }));
  return m;
}
function stockDeriveParProduit(data) {
  const m = {};
  const add = (produitId, kg) => { if (!produitId) return; m[produitId] = (m[produitId] || 0) + kg; };
  data.transformations.forEach((t) => add(t.produitDeriveId, toNum(t.kgProduitProduit)));
  data.ventes.forEach((v) => v.lignes.forEach((l) => {
    const produit = data.produits.find((p) => p.id === l.produitId);
    if (produit && produit.categorie === "Produit dérivé") add(l.produitId, -ligneKg(l, v.date, data));
  }));
  data.pertes.forEach((p) => { if (p.type === "ProduitDerive") add(p.produitId, -toNum(p.quantiteKg)); });
  return m;
}
function couleurCommande(dateLivraison) {
  const j = joursRestants(dateLivraison);
  if (j === null) return COMMANDE_COULEURS.bleu;
  if (j <= 2) return COMMANDE_COULEURS.rouge;
  if (j <= 5) return COMMANDE_COULEURS.jaune;
  return COMMANDE_COULEURS.vert;
}
function emojiCommande(dateLivraison) {
  const j = joursRestants(dateLivraison);
  if (j === null) return "🔵";
  if (j <= 2) return "🔴";
  if (j <= 5) return "🟡";
  return "🟢";
}

    { key: "rapports", label: "Rapports" },
    { key: "comparatifs", label: "Comparatifs annuels" },

  { key: "production", label: "🍇 Production", subs: [

  ]},

    { key: "cepages", label: "Cépages" },
    { key: "produits", label: "Produits" },
    { key: "formats", label: "Formats" },
    { key: "tarifs", label: "Tarifs" },
    { key: "clients", label: "Clients" },
    { key: "parcelles", label: "Parcelles" },
    { key: "plants", label: "Plants" },

  ]},
];

function App() {
  const [data, setData] = useState(EMPTY_DATA);
  const [loaded, setLoaded] = useState(false);
  const [activeModule, setActiveModule] = useState("pilotage");
  const [activeSub, setActiveSub] = useState("dashboard");
  const [saveState, setSaveState] = useState("idle");
  const [menuOpen, setMenuOpen] = useState(false);

  useEffect(() => {
    const link = document.createElement("link");
    link.rel = "stylesheet"; link.href = FONTS_HREF; document.head.appendChild(link);
    return () => document.head.removeChild(link);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          // Migration douce depuis la version 1.0 : renommage "Rebut"→"Mauvaise" et Brix par parcelle→par cépage
          const recoltesMigrees = (parsed.recoltes || []).map((r) => (r.qualite === "Rebut" ? { ...r, qualite: "Mauvaise" } : r));
          const brixMigres = (parsed.brixReadings || []).map((b) => {
            if (b.cepageId) return b;
            if (b.parcelleId) { const parcelle = (parsed.parcelles || []).find((p) => p.id === b.parcelleId); return { ...b, cepageId: parcelle ? parcelle.cepageId : null }; }
            return b;
          });
          const migre = { ...parsed, recoltes: recoltesMigrees, brixReadings: brixMigres };
          setData({ ...EMPTY_DATA, ...migre, parametres: { ...EMPTY_DATA.parametres, ...(migre.parametres || {}) } });
        }
      } catch (e) { /* première utilisation */ }
      finally { setLoaded(true); }
    })();
  }, []);

  const persist = async (next) => {
    setData(next); setSaveState("saving");
    try { const res = await window.storage.set(STORAGE_KEY, JSON.stringify(next), false); setSaveState(res ? "saved" : "error"); }
    catch (e) { setSaveState("error"); }
  };

  if (!loaded) {
    return <div style={{ background: C.ink, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: C.gold, letterSpacing: "0.15em", fontSize: 13 }}>OUVERTURE DE VITIGEST…</div>
    </div>;
  }

  const modProps = { data, persist };

  return (
    <div style={{ background: `radial-gradient(1200px 600px at 10% -10%, ${C.panelLight} 0%, ${C.ink} 55%)`, minHeight: "100vh", color: C.text, fontFamily: "'IBM Plex Sans', sans-serif" }}>
      <div style={{ maxWidth: 1240, margin: "0 auto", padding: "20px 20px 80px" }}>
        <Header
          saveState={saveState}
          nomEntreprise={data.parametres.nomEntreprise}
          menuOpen={menuOpen}
          setMenuOpen={setMenuOpen}
          activeModule={activeModule}
          activeSub={activeSub}
          onSelect={(m, s) => { setActiveModule(m); setActiveSub(s); setMenuOpen(false); }}
        />
        <div style={{ marginTop: 24 }}>
            {activeModule === "pilotage" && activeSub === "dashboard" && <DashboardView data={data} />}
            {activeModule === "pilotage" && activeSub === "rapports" && <RapportsView data={data} />}
            {activeModule === "pilotage" && activeSub === "comparatifs" && <ComparatifsView data={data} />}
            {activeModule === "pilotage" && activeSub === "taxes" && <TaxesView data={data} />}
            {activeModule === "pilotage" && activeSub === "export" && <ExportAnnuelView data={data} />}

            {activeModule === "production" && activeSub === "recoltes" && <RecoltesView {...modProps} />}
            {activeModule === "production" && activeSub === "rendement" && <RendementView data={data} />}
            {activeModule === "production" && activeSub === "brix" && <BrixView {...modProps} />}

            {activeModule === "inventaire" && activeSub === "stock" && <StockView data={data} />}
            {activeModule === "inventaire" && activeSub === "pertes" && <PertesView {...modProps} />}
            {activeModule === "inventaire" && activeSub === "transformations" && <TransformationsView {...modProps} />}

            {activeModule === "commercial" && activeSub === "commandes" && <CommandesView {...modProps} />}
            {activeModule === "commercial" && activeSub === "ventes" && <VentesView {...modProps} />}
            {activeModule === "commercial" && activeSub === "recevoir" && <ComptesARecevoirView {...modProps} />}
            {activeModule === "commercial" && activeSub === "statsclients" && <StatistiquesClientsView data={data} />}

            {activeModule === "referentiels" && activeSub === "cepages" && <CepagesView {...modProps} />}
            {activeModule === "referentiels" && activeSub === "produits" && <ProduitsView {...modProps} />}
            {activeModule === "referentiels" && activeSub === "formats" && <FormatsView {...modProps} />}
            {activeModule === "referentiels" && activeSub === "tarifs" && <TarifsView {...modProps} />}
            {activeModule === "referentiels" && activeSub === "clients" && <ClientsView {...modProps} />}
            {activeModule === "referentiels" && activeSub === "parcelles" && <ParcellesView {...modProps} />}
            {activeModule === "referentiels" && activeSub === "plants" && <PlantsView {...modProps} />}
            {activeModule === "referentiels" && activeSub === "parametres" && <ParametresView {...modProps} />}
            {activeModule === "referentiels" && activeSub === "sauvegarde" && <SauvegardeView {...modProps} />}
        </div>

function Header({ saveState, nomEntreprise, menuOpen, setMenuOpen, activeModule, activeSub, onSelect }) {
  const labels = { idle: "", saving: "Enregistrement…", saved: "Enregistré", error: "Échec de l'enregistrement" };
  const colors = { idle: C.textMuted, saving: C.gold, saved: C.olive, error: C.wine };
  const modActuel = NAV.find((m) => m.key === activeModule);
  const subActuel = modActuel && modActuel.subs.find((s) => s.key === activeSub);
  return (
    <div className="no-print" style={{ position: "relative" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", borderBottom: `1px solid ${C.line}`, paddingBottom: 16 }}>
        <div>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.25em", color: C.gold, marginBottom: 6 }}>
            {nomEntreprise ? nomEntreprise.toUpperCase() : "CARNET DE VIGNOBLE"}
          </div>
          <h1 style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, fontSize: 30, margin: 0, color: C.parchment }}>
            VitiGest <span style={{ fontSize: 16, color: C.textMuted, fontFamily: "'IBM Plex Mono', monospace" }}>{APP_VERSION}</span>
          </h1>
          <div style={{ fontSize: 13, color: C.textMuted, marginTop: 6 }}>
            {modActuel ? modActuel.label : ""} {subActuel ? `— ${subActuel.label}` : ""}
          </div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 8 }}>
          <button onClick={() => setMenuOpen(!menuOpen)} style={{ display: "flex", alignItems: "center", gap: 8, background: menuOpen ? C.gold : C.panel, color: menuOpen ? C.ink : C.parchment, border: `1px solid ${C.line}`, borderRadius: 4, padding: "10px 14px", fontFamily: "'IBM Plex Sans', sans-serif", fontWeight: 600, fontSize: 14.5, cursor: "pointer" }}>
            <span style={{ fontSize: 17, lineHeight: 1 }}>☰</span> Menu
          </button>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: colors[saveState], textAlign: "right", minHeight: 14 }}>{labels[saveState]}</div>
        </div>
      </div>
      {menuOpen && (
        <>
          <div onClick={() => setMenuOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", zIndex: 40 }} />
          <div style={{ position: "absolute", top: "100%", right: 0, marginTop: 8, width: 280, maxWidth: "90vw", maxHeight: "75vh", overflowY: "auto", background: C.panel, border: `1px solid ${C.line}`, borderRadius: 6, zIndex: 50, boxShadow: "0 16px 40px rgba(0,0,0,0.55)" }}>
            {NAV.map((mod) => (
              <div key={mod.key}>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.12em", color: C.textMuted, padding: "12px 14px 6px" }}>{mod.label}</div>
                {mod.subs.map((s) => {
                  const active = activeModule === mod.key && activeSub === s.key;
                  return (
                    <button key={s.key} onClick={() => onSelect(mod.key, s.key)} style={{ display: "block", width: "100%", textAlign: "left", background: active ? C.panelLight : "none", border: "none", padding: "11px 14px 11px 22px", color: active ? C.parchment : C.text, fontFamily: "'IBM Plex Sans', sans-serif", fontWeight: active ? 600 : 400, fontSize: 15, cursor: "pointer" }}>
                      {s.label}
                    </button>
                  );
                })}
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );

function Btn({ children, onClick, kind = "primary", type = "button", disabled }) {
  const styles = {
    primary: { background: C.gold, color: C.ink, border: "none" },

function Field({ label, children }) {

// ---------------- Éditeur générique ----------------
function EntityManager({ items, fields, onAdd, onUpdate, onDelete, renderRow, addLabel, formTitle }) {
  const emptyForm = () => Object.fromEntries(fields.map((f) => [f.key, f.default ?? ""]));
  const [form, setForm] = useState(emptyForm());
  const [editId, setEditId] = useState(null);
  const submit = (e) => {
    e.preventDefault();
    for (const f of fields) if (f.required && String(form[f.key] ?? "").trim() === "") return;
    if (editId) onUpdate(editId, form); else onAdd(form);
    setForm(emptyForm()); setEditId(null);
  };
  const edit = (item) => { setEditId(item.id); setForm(Object.fromEntries(fields.map((f) => [f.key, item[f.key] ?? ""]))); };
  const cancel = () => { setEditId(null); setForm(emptyForm()); };
  return (
    <div style={{ display: "flex", gap: 20, flexWrap: "wrap" }}>
      <Card style={{ flex: "1 1 270px" }}>
        {formTitle && <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 14 }}>{formTitle}</div>}
        <form onSubmit={submit}>
          {fields.map((f) => (
            <Field key={f.key} label={f.label.toUpperCase()}>
              {f.type === "select" ? (
                <select style={inputStyle} value={form[f.key]} onChange={(e) => setForm({ ...form, [f.key]: e.target.value })}>
                  <option value="">{f.required ? "Choisir…" : "— aucun —"}</option>
                  {f.options.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              ) : (
                <input style={inputStyle} type={f.type || "text"} step={f.step} value={form[f.key]} onChange={(e) => setForm({ ...form, [f.key]: e.target.value })} placeholder={f.placeholder} />
              )}
            </Field>
          ))}
          <div style={{ display: "flex", gap: 8 }}>
            <Btn type="submit">{editId ? "Mettre à jour" : addLabel || "Ajouter"}</Btn>
            {editId && <Btn kind="ghost" onClick={cancel}>Annuler</Btn>}
          </div>
        </form>
      </Card>
      <Card style={{ flex: "2 1 380px" }}>
        {items.length === 0 ? <EmptyState text="Aucun élément enregistré." /> : items.map((item) => (
          <div key={item.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 0", borderBottom: `1px solid ${C.line}`, gap: 10 }}>
            <div style={{ flex: 1 }}>{renderRow(item)}</div>
            <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
              <Btn kind="ghost" onClick={() => edit(item)}>Modifier</Btn>
              <Btn kind="danger" onClick={() => onDelete(item.id)}>Supprimer</Btn>
            </div>
          </div>
        ))}
      </Card>
    </div>
  );
}

function SauvegardeView({ data, persist }) {
  const [pending, setPending] = useState(null); // {parsed, counts}
  const [error, setError] = useState("");
  const fileInputRef = { current: null };

  const derniere = data.parametres.derniereExportation;
  const joursDepuis = derniere ? Math.floor((new Date() - new Date(derniere)) / 86400000) : null;
  const couleurRappel = joursDepuis == null ? C.wine : joursDepuis <= 7 ? C.olive : joursDepuis <= 30 ? C.gold : C.wine;
  const texteRappel = joursDepuis == null ? "Aucune exportation effectuée pour l'instant." : joursDepuis === 0 ? "Dernière exportation : aujourd'hui." : `Dernière exportation : il y a ${joursDepuis} jour${joursDepuis > 1 ? "s" : ""}.`;

  const handleExport = () => {
    const contenu = JSON.stringify(data, null, 2);
    const blob = new Blob([contenu], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `vitigest-sauvegarde-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    persist({ ...data, parametres: { ...data.parametres, derniereExportation: new Date().toISOString() } });
  };

  const handleFileChosen = (e) => {
    setError(""); setPending(null);
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const counts = {
          "Cépages": (parsed.cepages || []).length, "Parcelles": (parsed.parcelles || []).length,
          "Récoltes": (parsed.recoltes || []).length, "Clients": (parsed.clients || []).length,
          "Commandes": (parsed.commandes || []).length, "Ventes": (parsed.ventes || []).length,
          "Paiements": (parsed.paiements || []).length,
        };
        setPending({ parsed, counts });
      } catch (err) { setError("Ce fichier n'est pas une sauvegarde VitiGest valide (JSON illisible)."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const confirmerImport = () => {
    if (!pending) return;
    persist({ ...EMPTY_DATA, ...pending.parsed, parametres: { ...EMPTY_DATA.parametres, ...(pending.parsed.parametres || {}) } });
    setPending(null);
  };

  return (
    <div>
      <SectionTitle sub="Exportez régulièrement une copie de vos données, à conserver où vous voulez (iCloud Drive, Google Drive, clé USB…). Utile aussi pour transférer vos données d'un appareil à l'autre.">Sauvegarde</SectionTitle>

      <Card style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 10 }}>EXPORTER</div>
        <div style={{ fontSize: 14.5, color: couleurRappel, marginBottom: 14 }}>{texteRappel}</div>
        <Btn onClick={handleExport}>Exporter une copie de sauvegarde</Btn>
        <div style={{ fontSize: 12.5, color: C.textMuted, marginTop: 10 }}>

function buildRendementRows(data) {
  const years = new Set(); data.recoltes.forEach((r) => years.add(yearOf(r.date)));
  const rows = [];
  data.parcelles.forEach((p) => {
    years.forEach((year) => {
      const kg = data.recoltes.filter((r) => r.parcelleId === p.id && yearOf(r.date) === year && r.qualite !== "Mauvaise").reduce((s, r) => s + toNum(r.quantiteKg), 0);
      if (kg <= 0) return;
      const plants = effectiveNombrePlants(p.id, `${year}-12-31`, data);
      rows.push({ annee: year, parcelleId: p.id, parcelle: p.nom, cepageId: p.cepageId, kg, plants, rendement: plants ? kg / plants : null });
    });
  });
  return rows.sort((a, b) => (b.annee !== a.annee ? (b.annee < a.annee ? -1 : 1) : a.parcelle.localeCompare(b.parcelle)));
}

function RendementView({ data }) {
  const rows = useMemo(() => buildRendementRows(data), [data]);
  const parCepage = useMemo(() => {
    const m = {};
    rows.forEach((r) => { if (r.plants == null) return; const key = `${r.annee}__${r.cepageId}`; if (!m[key]) m[key] = { annee: r.annee, cepageId: r.cepageId, kg: 0, plants: 0 }; m[key].kg += r.kg; m[key].plants += r.plants; });
    return Object.values(m).map((v) => ({ ...v, rendement: v.plants ? v.kg / v.plants : null }));
  }, [rows]);
  const chartData = useMemo(() => {

  }, [parCepage, data.cepages]);

  return (
    <div>
      <SectionTitle sub="Rendement = kg récoltés ÷ nombre de plants effectif, regroupé par cépage et par année.">Rendement par plant</SectionTitle>

                  <YAxis tick={axisTick} label={{ value: "kg / plant", angle: -90, position: "insideLeft", fill: C.textMuted, fontSize: 12 }} />
                  <Tooltip {...tooltipStyle} />

              </div>
            ); })}
          </Card>

const MOIS_FR = { janvier: 1, fevrier: 2, mars: 3, avril: 4, mai: 5, juin: 6, juillet: 7, aout: 8, septembre: 9, octobre: 10, novembre: 11, decembre: 12 };
const normaliserMois = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const pad2 = (n) => String(n).padStart(2, "0");
function extraireDateEtReste(tokens) {
  for (let i = 0; i < tokens.length; i++) {
    let m = tokens[i].match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
    if (m) return { date: `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`, reste: tokens.slice(0, i).concat(tokens.slice(i + 1)) };
    m = tokens[i].match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
    if (m) return { date: `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`, reste: tokens.slice(0, i).concat(tokens.slice(i + 1)) };
  }
  for (let i = 0; i < tokens.length - 2; i++) {
    const jour = tokens[i].match(/^\d{1,2}$/);
    const moisNum = MOIS_FR[normaliserMois(tokens[i + 1])];
    const annee = tokens[i + 2] && tokens[i + 2].match(/^\d{4}$/);
    if (jour && moisNum && annee) return { date: `${tokens[i + 2]}-${pad2(moisNum)}-${pad2(tokens[i])}`, reste: tokens.slice(0, i).concat(tokens.slice(i + 3)) };
  }
  return null;
}

function BrixView({ data, persist }) {
  const years = useMemo(() => {
    const s = new Set([...data.brixReadings.map((b) => yearOf(b.date)), ...data.degreJours.map((d) => yearOf(d.date)), String(new Date().getFullYear())]);
    return Array.from(s).filter(Boolean).sort().reverse();
  }, [data]);
  const [year, setYear] = useState(years[0]);
  const [cepageId, setCepageId] = useState("");
  const [colle, setColle] = useState("");
  const [apercuColle, setApercuColle] = useState(null);
  const [erreurColle, setErreurColle] = useState("");
  const [ignoreesColle, setIgnoreesColle] = useState([]);

  const analyserColle = () => {
    setErreurColle(""); setApercuColle(null); setIgnoreesColle([]);
    const lignes = colle.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const rows = []; const ignorees = [];
    lignes.forEach((ligne) => {
      const tokens = ligne.split(/\t|;|,|\s{2,}/).map((t) => t.trim()).filter(Boolean);
      const found = extraireDateEtReste(tokens.length > 1 ? tokens : ligne.split(/\s+/));
      if (!found) { ignorees.push(ligne); return; }
      const nombres = found.reste.map((t) => t.replace(/\s/g, "").replace(",", ".")).filter((t) => /^-?\d+(\.\d+)?$/.test(t));
      if (nombres.length === 0) { ignorees.push(ligne); return; }
      const valeur = Number(nombres[nombres.length - 1]);
      if (isNaN(valeur)) { ignorees.push(ligne); return; }
      rows.push({ date: found.date, cumulAnnee: valeur });
    });
    setIgnoreesColle(ignorees);
    if (rows.length === 0) setErreurColle(`Aucune ligne reconnue sur ${lignes.length} ligne(s) collée(s). Vérifiez qu'une date (AAAA-MM-JJ, JJ/MM/AAAA ou « 15 juillet 2026 ») et un nombre apparaissent sur chaque ligne.`);
    else setApercuColle(rows);
  };

  const confirmerColle = () => {
    if (!apercuColle) return;
    const map = new Map(data.degreJours.map((d) => [d.date, d]));
    apercuColle.forEach((r) => { const existant = map.get(r.date); if (existant) map.set(r.date, { ...existant, cumulAnnee: r.cumulAnnee }); else map.set(r.date, { id: uid(), date: r.date, cumulAnnee: r.cumulAnnee }); });
    persist({ ...data, degreJours: Array.from(map.values()) });
    setApercuColle(null); setColle("");
  };

  const correspondance = useMemo(() => data.brixReadings
    .filter((b) => yearOf(b.date) === year && (!cepageId || b.cepageId === cepageId))
    .map((b) => {
      const dj = data.degreJours.filter((d) => d.date <= b.date && yearOf(d.date) === year).sort((a, c) => (c.date < a.date ? -1 : 1))[0];
      return { brixDate: b.date, cepageId: b.cepageId, brix: Number(b.brix), djDate: dj ? dj.date : null, dj: dj ? Number(dj.cumulAnnee) : null };
    })
    .sort((a, b) => (a.brixDate < b.brixDate ? -1 : 1)), [data, year, cepageId]);

  const scatterData = useMemo(() => correspondance
    .filter((r) => r.dj != null && isFinite(r.dj) && isFinite(r.brix))
    .map((r) => ({ date: r.brixDate, brix: r.brix, degresJours: r.dj })), [correspondance]);

  return (
    <div>
      <SectionTitle sub="Corrèle l'indice Brix par cépage aux degrés-jours cumulés pour repérer la tendance de maturation et anticiper la date de récolte.">Brix &amp; degrés-jours</SectionTitle>
      <Card style={{ marginBottom: 20 }}>
        <div style={{ display: "flex", gap: 16, marginBottom: 14, flexWrap: "wrap" }}>
          <Field label="ANNÉE"><select style={inputStyle} value={year} onChange={(e) => setYear(e.target.value)}>{years.map((y) => <option key={y} value={y}>{y}</option>)}</select></Field>
          <Field label="CÉPAGE (optionnel)">
            <select style={inputStyle} value={cepageId} onChange={(e) => setCepageId(e.target.value)}>
              <option value="">Tous les cépages</option>
              {data.cepages.map((c) => <option key={c.id} value={c.id}>{c.nom}</option>)}
            </select>
          </Field>
        </div>
        {scatterData.length === 0 ? (
          <EmptyState text={data.degreJours.filter((d) => yearOf(d.date) === year).length === 0
            ? "Aucun degré-jour saisi pour cette année — ajoutez-en au moins un ci-dessous (collé ou manuel) pour que le graphique puisse s'afficher."
            : "Aucun relevé de Brix de cette année n'a pu être associé à un degré-jour (le degré-jour doit être daté avant ou le même jour que le relevé de Brix)."} />
        ) : (
          <div style={{ height: 300 }}>
            <ResponsiveContainer width="100%" height="100%">
              <ScatterChart margin={{ top: 10, right: 20, left: 0, bottom: 10 }}>
                <CartesianGrid stroke={C.line} />
                <XAxis type="number" dataKey="degresJours" name="Degrés-jours cumulés" tick={axisTick} label={{ value: "Degrés-jours cumulés", position: "insideBottom", offset: -5, fill: C.textMuted, fontSize: 12 }} />
                <YAxis type="number" dataKey="brix" name="Brix" tick={axisTick} label={{ value: "°Brix", angle: -90, position: "insideLeft", fill: C.textMuted, fontSize: 12 }} />
                <ZAxis range={[60, 60]} />
                <Tooltip {...tooltipStyle} cursor={{ stroke: C.line }} />
                <Scatter data={scatterData} fill={C.gold} />
              </ScatterChart>
            </ResponsiveContainer>
          </div>
        )}
      </Card>

      {correspondance.length > 0 && (
        <Card style={{ marginBottom: 20 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 10 }}>CORRESPONDANCE BRIX ↔ DEGRÉS-JOURS — {year}</div>
          <div style={{ fontSize: 13, color: C.textMuted, marginBottom: 10 }}>Chaque relevé de Brix est associé au dernier degré-jour connu à cette date ou avant. « Aucun » signifie qu'aucun degré-jour n'a encore été saisi avant cette date.</div>
          {correspondance.map((r, i) => { const cep = data.cepages.find((c) => c.id === r.cepageId); return (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${C.line}`, fontSize: 13 }}>
              <div>{fmtDate(r.brixDate)} · {cep ? cep.nom : "?"} · {r.brix} °Bx</div>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: r.dj == null ? C.wine : C.text }}>{r.dj == null ? "Aucun degré-jour disponible" : `${r.dj} DJ (au ${fmtDate(r.djDate)})`}</div>
            </div>
          ); })}
        </Card>
      )}

      <Card style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 10 }}>IMPORTER LES DEGRÉS-JOURS DEPUIS LA STATION</div>
        <div style={{ fontSize: 13, color: C.textMuted, marginBottom: 10 }}>
          Station configurée : <span style={{ color: C.parchment }}>{data.parametres.stationDegresJours || "non définie"}</span> (modifiable dans Référentiels → Paramètres). Impossible de récupérer les données automatiquement — le site d'Agri-Réseau ne fournit pas d'accès direct pour les applications externes. Ouvrez la page, copiez le tableau, puis collez-le ci-dessous : VitiGest reconnaît les lignes « date + valeur » et vous montre un aperçu avant d'ajouter quoi que ce soit.
        </div>
        <div style={{ marginBottom: 12 }}>
          <Btn kind="ghost" onClick={() => window.open("https://www.agrireseau.net/vigne-vin/documents?s=1194", "_blank")}>Ouvrir la page des degrés-jours (Agri-Réseau) ↗</Btn>
        </div>
        <Field label="COLLER LES DONNÉES COPIÉES (une entrée par ligne : date puis valeur — fonctionne aussi avec un collage direct depuis Excel)">
          <textarea style={{ ...inputStyle, minHeight: 110, fontFamily: "'IBM Plex Mono', monospace", resize: "vertical" }} value={colle} onChange={(e) => setColle(e.target.value)} placeholder={"2026-06-01\t45\n2026-06-08\t112\n15 juin 2026\t198"} />
        </Field>
        <Btn onClick={analyserColle}>Analyser</Btn>
        {erreurColle && <div style={{ color: C.wine, fontSize: 13, marginTop: 10 }}>{erreurColle}</div>}

            <div style={{ maxHeight: 160, overflowY: "auto", marginBottom: 14 }}>

function CommandesView({ data, persist }) {
  const devise = data.parametres.devise;
  const stockVirtuel = useMemo(() => stockVirtuelParCepage(data), [data]);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ clientId: "", nomParticulier: "", date: todayISO(), dateLivraisonSouhaitee: "", lignes: [ligneVide()] });
  const [editId, setEditId] = useState(null);
  const [transferId, setTransferId] = useState(null);
  const [transferForm, setTransferForm] = useState(null);

  const resetForm = () => { setForm({ clientId: "", nomParticulier: "", date: todayISO(), dateLivraisonSouhaitee: "", lignes: [ligneVide()] }); setShowForm(false); setEditId(null); };
  const updateLigne = (i, field, val) => { const next = [...form.lignes]; next[i] = { ...next[i], [field]: val }; setForm({ ...form, lignes: next }); };

  const submit = (e) => {
    e.preventDefault();
    if (!form.clientId) return;
    for (const l of form.lignes) { if (!l.produitId || !l.formatId || !l.quantiteFormat || !l.prixUnitaire) return; const produit = data.produits.find((p) => p.id === l.produitId); if (produit && produit.categorie === "Raisin frais" && !l.cepageId) return; }
    const lignesFinales = form.lignes.map((l) => ({ produitId: l.produitId, formatId: l.formatId, cepageId: l.cepageId || null, quantiteFormat: Number(l.quantiteFormat), prixUnitaire: Number(l.prixUnitaire) }));
    if (editId) {
      persist({ ...data, commandes: data.commandes.map((c) => (c.id === editId ? { ...c, clientId: form.clientId, nomParticulier: form.nomParticulier, date: form.date, dateLivraisonSouhaitee: form.dateLivraisonSouhaitee || null, lignes: lignesFinales } : c)) });
    } else {
      const commande = { id: uid(), clientId: form.clientId, nomParticulier: form.nomParticulier, date: form.date, dateLivraisonSouhaitee: form.dateLivraisonSouhaitee || null, lignes: lignesFinales, statut: "En cours", venteId: null };
      persist({ ...data, commandes: [commande, ...data.commandes] });
    }
    resetForm();
  };

  const edit = (c) => { setEditId(c.id); setShowForm(true); setForm({ clientId: c.clientId, nomParticulier: c.nomParticulier || "", date: c.date, dateLivraisonSouhaitee: c.dateLivraisonSouhaitee || "", lignes: c.lignes.map((l) => ({ ...l, quantiteFormat: String(l.quantiteFormat), prixUnitaire: String(l.prixUnitaire), cepageId: l.cepageId || "" })) }); };
  const remove = (id) => persist({ ...data, commandes: data.commandes.filter((c) => c.id !== id) });

  const startTransfer = (c) => { setTransferId(c.id); setTransferForm({ date: todayISO(), avecFacture: true, numeroFacture: "", lignes: c.lignes.map((l) => ({ ...l, quantiteFormat: String(l.quantiteFormat), prixUnitaire: String(l.prixUnitaire), cepageId: l.cepageId || "" })) }); };
  const cancelTransfer = () => { setTransferId(null); setTransferForm(null); };
  const updateTransferLigne = (i, field, val) => { const next = [...transferForm.lignes]; next[i] = { ...next[i], [field]: val }; setTransferForm({ ...transferForm, lignes: next }); };

  const confirmTransfer = (commande) => {
    const lignesFinales = transferForm.lignes.map((l) => ({ produitId: l.produitId, formatId: l.formatId, cepageId: l.cepageId || null, quantiteFormat: Number(l.quantiteFormat), prixUnitaire: Number(l.prixUnitaire) })).filter((l) => l.quantiteFormat > 0);
    if (lignesFinales.length === 0) return;
    const vente = { id: uid(), clientId: commande.clientId, nomParticulier: commande.nomParticulier || "", date: transferForm.date, avecFacture: transferForm.avecFacture, numeroFacture: transferForm.numeroFacture || null, dateEcheance: transferForm.avecFacture ? addDays(transferForm.date, data.parametres.delaiPaiementJours) : null, commandeId: commande.id, lignes: lignesFinales };
    persist({ ...data, ventes: [vente, ...data.ventes], commandes: data.commandes.map((c) => (c.id === commande.id ? { ...c, statut: "Transférée", venteId: vente.id } : c)) });
    cancelTransfer();
  };

  const commandesEnCours = data.commandes.filter((c) => c.statut === "En cours").sort((a, b) => {
    const ja = joursRestants(a.dateLivraisonSouhaitee), jb = joursRestants(b.dateLivraisonSouhaitee);
    if (ja === null && jb === null) return 0; if (ja === null) return 1; if (jb === null) return -1; return ja - jb;
  });
  const commandesTransferees = data.commandes.filter((c) => c.statut !== "En cours");

  return (
    <div>
      <SectionTitle sub="Les commandes retranchent virtuellement le stock de raisin frais ici uniquement — le reste du programme ne comptabilise l'inventaire qu'à partir des récoltes et ventes réelles. Légende : 🔴 livraison dans 2 jours ou moins · 🟡 3 à 5 jours · 🟢 plus de 5 jours · 🔵 aucune date précisée.">Commandes</SectionTitle>

      <Card style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 14 }}>STOCK VIRTUEL (après commandes en cours)</div>
        {Object.keys(stockVirtuel).length === 0 ? <EmptyState text="Aucun stock de raisin pour le moment." /> : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 12 }}>
            {Object.entries(stockVirtuel).map(([cepId, val]) => { const cep = data.cepages.find((c) => c.id === cepId); return (
              <div key={cepId} style={{ border: `1px solid ${C.line}`, borderRadius: 3, padding: 12 }}>
                <div style={{ fontSize: 13.5, color: C.textMuted, marginBottom: 4 }}>{cep ? cep.nom : "?"}</div>
                <div style={{ fontFamily: "'Fraunces', serif", fontSize: 21, color: val < 0 ? C.wine : C.parchment }}>{fmtKg(val)}</div>
              </div>
            ); })}
          </div>
        )}
      </Card>

      <div style={{ marginBottom: 16 }}>
        {!showForm ? <Btn onClick={() => setShowForm(true)}>+ Nouvelle commande</Btn> : (
          <Card>
            {data.clients.length === 0 || data.produits.length === 0 || data.formats.length === 0 ? <EmptyState text="Créez d'abord un client, un produit et un format." /> : (
              <form onSubmit={submit}>
                <Field label="CLIENT">
                  <select style={inputStyle} value={form.clientId} onChange={(e) => setForm({ ...form, clientId: e.target.value })} required>
                    <option value="">Choisir…</option>
                    {data.clients.map((c) => <option key={c.id} value={c.id}>{c.nom}</option>)}
                  </select>
                </Field>
                {(() => { const client = data.clients.find((c) => c.id === form.clientId); return client && client.type === "Particulier" ? (
                  <Field label="NOM DU PARTICULIER"><input style={inputStyle} value={form.nomParticulier} onChange={(e) => setForm({ ...form, nomParticulier: e.target.value })} /></Field>
                ) : null; })()}
                <div style={{ display: "flex", gap: 8 }}>
                  <div style={{ flex: 1 }}><Field label="DATE DE COMMANDE"><input style={inputStyle} type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field></div>
                  <div style={{ flex: 1 }}><Field label="DATE DE LIVRAISON SOUHAITÉE"><input style={inputStyle} type="date" value={form.dateLivraisonSouhaitee} onChange={(e) => setForm({ ...form, dateLivraisonSouhaitee: e.target.value })} /></Field></div>
                </div>
                {form.lignes.map((l, i) => (
                  <LigneEditor key={i} l={l} data={data} date={form.date} canRemove={form.lignes.length > 1}
                    onChange={(field, val) => updateLigne(i, field, val)}
                    onRemove={() => setForm({ ...form, lignes: form.lignes.filter((_, idx) => idx !== i) })} />
                ))}
                <div style={{ marginBottom: 14 }}>
                  <button type="button" onClick={() => setForm({ ...form, lignes: [...form.lignes, ligneVide()] })} style={{ background: "none", border: `1px dashed ${C.line}`, color: C.gold, borderRadius: 3, padding: "8px 12px", fontSize: 13.5, cursor: "pointer", width: "100%" }}>+ Ajouter une ligne</button>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <Btn type="submit">{editId ? "Mettre à jour la commande" : "Enregistrer la commande"}</Btn>
                  <Btn kind="ghost" onClick={resetForm}>Annuler</Btn>
                </div>
              </form>
            )}
          </Card>
        )}
      </div>

      <Card style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 14 }}>COMMANDES EN COURS — PAR DATE DE LIVRAISON SOUHAITÉE</div>
        {commandesEnCours.length === 0 ? <EmptyState text="Aucune commande en cours." /> : commandesEnCours.map((c) => {
          const client = data.clients.find((x) => x.id === c.clientId);
          const total = venteTotalMontant(c);
          const couleur = couleurCommande(c.dateLivraisonSouhaitee);
          const j = joursRestants(c.dateLivraisonSouhaitee);
          return (
            <div key={c.id} style={{ borderLeft: `4px solid ${couleur}`, background: C.ink, borderRadius: 3, padding: 12, marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
                <div>
                  <div style={rowTitle}>{emojiCommande(c.dateLivraisonSouhaitee)} {client ? client.nom : "?"}{c.nomParticulier ? ` — ${c.nomParticulier}` : ""}</div>
                  <div style={rowSub}>Commandée le {fmtDate(c.date)} · Livraison souhaitée : {c.dateLivraisonSouhaitee ? `${fmtDate(c.dateLivraisonSouhaitee)}${j != null ? ` (${j} j)` : ""}` : "non précisée"}</div>
                  <div style={{ fontSize: 13, color: C.textMuted, marginTop: 4 }}>
                    {c.lignes.map((l, i) => { const p = data.produits.find((x) => x.id === l.produitId); const f = data.formats.find((x) => x.id === l.formatId); const cep = data.cepages.find((x) => x.id === l.cepageId); return <div key={i}>{p ? p.nom : "?"}{cep ? ` (${cep.nom})` : ""} · {l.quantiteFormat} {f ? f.nom : ""}</div>; })}
                  </div>
                </div>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 16.5 }}>{fmtMoney(total, devise)}</div>
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                <Btn onClick={() => startTransfer(c)}>Commande préparée →</Btn>
                <Btn kind="ghost" onClick={() => edit(c)}>Modifier</Btn>
                <Btn kind="danger" onClick={() => remove(c.id)}>Supprimer</Btn>
              </div>
              {transferId === c.id && transferForm && (
                <div style={{ marginTop: 12, borderTop: `1px solid ${C.line}`, paddingTop: 12 }}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 10 }}>CONFIRMER LA VENTE (modifiable si livraison partielle)</div>
                  {transferForm.lignes.map((l, i) => (
                    <LigneEditor key={i} l={l} data={data} date={transferForm.date} canRemove={false} onChange={(field, val) => updateTransferLigne(i, field, val)} onRemove={() => {}} />
                  ))}
                  <div style={{ display: "flex", gap: 8 }}>
                    <div style={{ flex: 1 }}><Field label="DATE DE VENTE"><input style={inputStyle} type="date" value={transferForm.date} onChange={(e) => setTransferForm({ ...transferForm, date: e.target.value })} /></Field></div>
                    <div style={{ flex: 1 }}><Field label="FACTURATION"><select style={inputStyle} value={transferForm.avecFacture ? "oui" : "non"} onChange={(e) => setTransferForm({ ...transferForm, avecFacture: e.target.value === "oui" })}><option value="oui">Avec facture</option><option value="non">Sans facture</option></select></Field></div>
                  </div>
                  {transferForm.avecFacture && <Field label="NUMÉRO DE FACTURE"><input style={inputStyle} value={transferForm.numeroFacture} onChange={(e) => setTransferForm({ ...transferForm, numeroFacture: e.target.value })} placeholder="ex. F0001" /></Field>}
                  <div style={{ display: "flex", gap: 8 }}>
                    <Btn onClick={() => confirmTransfer(c)}>Confirmer la vente</Btn>
                    <Btn kind="ghost" onClick={cancelTransfer}>Annuler</Btn>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </Card>

      {commandesTransferees.length > 0 && (
        <Card>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 14 }}>COMMANDES TRANSFÉRÉES</div>
          {commandesTransferees.map((c) => { const client = data.clients.find((x) => x.id === c.clientId); return (
            <div key={c.id} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${C.line}`, fontSize: 13 }}>
              <div>{client ? client.nom : "?"} · {fmtDate(c.date)}</div>
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}><span style={{ color: C.olive }}>Transférée</span><Btn kind="danger" onClick={() => remove(c.id)}>Suppr.</Btn></div>
            </div>
          ); })}
        </Card>
      )}
    </div>
  );
}

function VentesView({ data, persist }) {
  const devise = data.parametres.devise;
  const [clientId, setClientId] = useState("");
  const [nomParticulier, setNomParticulier] = useState("");
  const [date, setDate] = useState(todayISO());
  const [avecFacture, setAvecFacture] = useState(true);
  const [numeroFacture, setNumeroFacture] = useState("");
  const [lignes, setLignes] = useState([ligneVide()]);

  const updateLigne = (i, field, val) => { const next = [...lignes]; next[i] = { ...next[i], [field]: val }; setLignes(next); };
  const client = data.clients.find((c) => c.id === clientId);
  const totalVente = lignes.reduce((s, l) => s + ligneMontant(l), 0);

  const submit = (e) => {
    e.preventDefault();
    if (!clientId) return;

              {client && client.type === "Particulier" && <Field label="NOM DU PARTICULIER"><input style={inputStyle} value={nomParticulier} onChange={(e) => setNomParticulier(e.target.value)} /></Field>}
              <Field label="DATE"><input style={inputStyle} type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
              <Field label="FACTURATION"><select style={inputStyle} value={avecFacture ? "oui" : "non"} onChange={(e) => setAvecFacture(e.target.value === "oui")}><option value="oui">Avec facture (suivi des comptes à recevoir)</option><option value="non">Sans facture (vente comptant)</option></select></Field>
              {avecFacture && <Field label="NUMÉRO DE FACTURE"><input style={inputStyle} value={numeroFacture} onChange={(e) => setNumeroFacture(e.target.value)} placeholder="ex. F0001" /></Field>}
              {lignes.map((l, i) => (

                  onChange={(field, val) => updateLigne(i, field, val)}

              <div style={{ marginBottom: 14 }}>

              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12, fontSize: 15.5 }}><span style={{ color: C.textMuted }}>Total</span><span style={{ fontFamily: "'IBM Plex Mono', monospace", color: C.gold }}>{fmtMoney(totalVente, devise)}</span></div>

            const c = data.clients.find((x) => x.id === v.clientId);
            const total = venteTotalMontant(v);

function DashboardView({ data }) {

  const stockTotal = Object.values(stockRaisin).reduce((a, b) => a + b, 0);
  const anneeCourante = String(new Date().getFullYear());
  const recolteAnnee = data.recoltes.filter((r) => yearOf(r.date) === anneeCourante && r.qualite !== "Mauvaise").reduce((a, r) => a + toNum(r.quantiteKg), 0);
  const ventesAnnee = data.ventes.filter((v) => yearOf(v.date) === anneeCourante);
  const revenuAnnee = ventesAnnee.reduce((a, v) => a + venteTotalMontant(v), 0);
  const totalARecevoir = data.ventes.filter((v) => v.avecFacture).reduce((a, v) => a + venteMontantDu(v, data), 0);

  const kgVendusAnnee = ventesAnnee.reduce((a, v) => a + v.lignes.reduce((s, l) => { const p = data.produits.find((x) => x.id === l.produitId); return p && p.categorie === "Raisin frais" ? s + ligneKg(l, v.date, data) : s; }, 0), 0);
  const kgTransformesAnnee = data.transformations.filter((t) => yearOf(t.date) === anneeCourante).reduce((a, t) => a + toNum(t.kgRaisinConsomme), 0);
  const kgPertesAnnee = data.pertes.filter((p) => p.type === "Raisin" && yearOf(p.date) === anneeCourante).reduce((a, p) => a + toNum(p.quantiteKg), 0);
  const netAnnee = recolteAnnee - kgVendusAnnee - kgPertesAnnee - kgTransformesAnnee;

  const dernieresVentes = [...data.ventes].sort((a, b) => (b.date < a.date ? -1 : 1)).slice(0, 5);

  return (
    <div>
      <SectionTitle>Tableau de bord</SectionTitle>

        <StatCard label={`Ventes ${anneeCourante}`} value={fmtMoney(revenuAnnee, devise)} accent={C.gold} />
        <StatCard label="Comptes à recevoir" value={fmtMoney(totalARecevoir, devise)} accent={totalARecevoir > 0 ? C.wine : C.olive} />
      </div>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 20 }}>
        <StatCard label={`Kg vendus (${anneeCourante})`} value={fmtKg(kgVendusAnnee)} />
        <StatCard label={`Kg transformés (${anneeCourante})`} value={fmtKg(kgTransformesAnnee)} />
        <StatCard label={`Pertes (${anneeCourante})`} value={fmtKg(kgPertesAnnee)} accent={C.wine} />
        <StatCard label={`Net (récolte − vendu − pertes − transformé)`} value={fmtKg(netAnnee)} accent={C.blue} />
      </div>
      <Card>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 14 }}>DERNIÈRES VENTES</div>
        {dernieresVentes.length === 0 ? <EmptyState text="Aucune vente enregistrée." /> : dernieresVentes.map((v) => { const client = data.clients.find((c) => c.id === v.clientId); return (
          <div key={v.id} style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: `1px solid ${C.line}`, fontSize: 13 }}>
            <div><div>{client ? client.nom : "?"}</div><div style={{ color: C.textMuted, fontSize: 12.5 }}>{fmtDate(v.date)}</div></div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{fmtMoney(venteTotalMontant(v), devise)}</div>
          </div>
        ); })}
      </Card>
    </div>
  );

function RapportsView({ data }) {
  const devise = data.parametres.devise;
  const years = useMemo(() => { const s = new Set([...data.recoltes.map((r) => yearOf(r.date)), ...data.ventes.map((v) => yearOf(v.date)), String(new Date().getFullYear())]); return Array.from(s).filter(Boolean).sort().reverse(); }, [data]);
  const [year, setYear] = useState(years[0]);

  const prodParCepage = useMemo(() => {
    const m = {}; data.recoltes.filter((r) => yearOf(r.date) === year && r.qualite !== "Mauvaise").forEach((r) => { m[r.cepageId] = (m[r.cepageId] || 0) + toNum(r.quantiteKg); });
    return Object.entries(m).map(([id, kg]) => ({ nom: (data.cepages.find((c) => c.id === id) || {}).nom || "?", kg })).sort((a, b) => b.kg - a.kg);
  }, [data, year]);

  const ventesAnnee = useMemo(() => data.ventes.filter((v) => yearOf(v.date) === year), [data, year]);

  const ventesParClient = useMemo(() => { const m = {}; ventesAnnee.forEach((v) => { m[v.clientId] = (m[v.clientId] || 0) + venteTotalMontant(v); }); return Object.entries(m).map(([id, montant]) => ({ nom: (data.clients.find((c) => c.id === id) || {}).nom || "?", montant })).sort((a, b) => b.montant - a.montant); }, [ventesAnnee, data.clients]);

  const ventesParCepage = useMemo(() => {
    const m = {};
    ventesAnnee.forEach((v) => v.lignes.forEach((l) => { const p = data.produits.find((x) => x.id === l.produitId); if (p && p.categorie === "Raisin frais" && l.cepageId) m[l.cepageId] = (m[l.cepageId] || 0) + ligneMontant(l); }));
    return Object.entries(m).map(([id, montant]) => ({ name: (data.cepages.find((c) => c.id === id) || {}).nom || "?", value: Math.round(montant * 100) / 100 })).sort((a, b) => b.value - a.value);
  }, [ventesAnnee, data.produits, data.cepages]);

  const ventesParProduitFormat = useMemo(() => {
    const m = {}; ventesAnnee.forEach((v) => v.lignes.forEach((l) => { const key = `${l.produitId}__${l.formatId}`; if (!m[key]) m[key] = { produitId: l.produitId, formatId: l.formatId, qte: 0, montant: 0 }; m[key].qte += toNum(l.quantiteFormat); m[key].montant += ligneMontant(l); }));
    return Object.values(m).map((v) => ({ produit: (data.produits.find((p) => p.id === v.produitId) || {}).nom || "?", format: (data.formats.find((f) => f.id === v.formatId) || {}).nom || "?", qte: v.qte, montant: v.montant })).sort((a, b) => b.montant - a.montant);
  }, [ventesAnnee, data.produits, data.formats]);

  const kgParHeureVendange = useMemo(() => {
    const m = {};
    data.recoltes.filter((r) => yearOf(r.date) === year && r.tempsVendangeHeures).forEach((r) => { if (!m[r.cepageId]) m[r.cepageId] = { kg: 0, heures: 0 }; m[r.cepageId].kg += toNum(r.quantiteKg); m[r.cepageId].heures += toNum(r.tempsVendangeHeures); });
    return Object.entries(m).map(([id, v]) => ({ nom: (data.cepages.find((c) => c.id === id) || {}).nom || "?", kgParHeure: v.heures ? v.kg / v.heures : null, kg: v.kg, heures: v.heures })).filter((r) => r.kgParHeure != null);
  }, [data.recoltes, year, data.cepages]);

  return (
    <div>
      <SectionTitle>Rapports</SectionTitle>
      <Field label="ANNÉE"><select style={{ ...inputStyle, maxWidth: 160 }} value={year} onChange={(e) => setYear(e.target.value)}>{years.map((y) => <option key={y} value={y}>{y}</option>)}</select></Field>

      <Card style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 14 }}>PRODUCTION PAR CÉPAGE — {year}</div>
        {prodParCepage.length === 0 ? <EmptyState text="Aucune récolte cette année-là." /> : (
          <div style={{ height: 260 }}><ResponsiveContainer width="100%" height="100%"><BarChart data={prodParCepage} margin={{ top: 10, right: 10, left: 0, bottom: 10 }}><CartesianGrid stroke={C.line} vertical={false} /><XAxis dataKey="nom" tick={axisTick} /><YAxis tick={axisTick} /><Tooltip {...tooltipStyle} /><Bar dataKey="kg" fill={C.olive} radius={[2, 2, 0, 0]} /></BarChart></ResponsiveContainer></div>
        )}
      </Card>

      <Card style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 14 }}>RÉPARTITION DES VENTES $ PAR CÉPAGE (RAISIN FRAIS) — {year}</div>
        {ventesParCepage.length === 0 ? <EmptyState text="Aucune vente de raisin frais cette année-là." /> : (
          <div style={{ height: 280 }}>
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={ventesParCepage} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={95} label={(e) => `${e.name} ${fmtMoney(e.value, devise)}`}>
                  {ventesParCepage.map((entry, i) => <Cell key={i} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
                </Pie>
                <Tooltip {...tooltipStyle} formatter={(v) => fmtMoney(v, devise)} />
              </PieChart>
            </ResponsiveContainer>
          </div>
        )}
      </Card>

      <Card style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 14 }}>VENTES PAR CLIENT — {year}</div>
        {ventesParClient.length === 0 ? <EmptyState text="Aucune vente cette année-là." /> : (
          <div style={{ height: 260 }}><ResponsiveContainer width="100%" height="100%"><BarChart data={ventesParClient} margin={{ top: 10, right: 10, left: 0, bottom: 10 }}><CartesianGrid stroke={C.line} vertical={false} /><XAxis dataKey="nom" tick={axisTick} /><YAxis tick={axisTick} /><Tooltip {...tooltipStyle} formatter={(v) => fmtMoney(v, devise)} /><Bar dataKey="montant" fill={C.gold} radius={[2, 2, 0, 0]} /></BarChart></ResponsiveContainer></div>
        )}
      </Card>

      <Card style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 14 }}>VENTES PAR PRODUIT & FORMAT — {year}</div>
        {ventesParProduitFormat.length === 0 ? <EmptyState text="Aucune vente cette année-là." /> : ventesParProduitFormat.map((r, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: `1px solid ${C.line}`, fontSize: 13 }}>
            <div>{r.produit} — {r.format}</div><div style={{ display: "flex", gap: 16 }}><span style={{ color: C.textMuted }}>{r.qte} unités</span><span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{fmtMoney(r.montant, devise)}</span></div>
          </div>
        ))}
      </Card>

      <Card>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 14 }}>KG RÉCOLTÉS PAR HEURE DE VENDANGE — {year}</div>
        {kgParHeureVendange.length === 0 ? <EmptyState text="Aucune récolte avec temps de vendange renseigné cette année-là." /> : kgParHeureVendange.map((r, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: `1px solid ${C.line}`, fontSize: 13 }}>
            <div>{r.nom}</div><div style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{r.kgParHeure.toFixed(1)} kg/h <span style={{ color: C.textMuted }}>({fmtKg(r.kg)} / {r.heures} h)</span></div>
          </div>
        ))}
      </Card>
    </div>
  );
}

function ComparatifsView({ data }) {
  const devise = data.parametres.devise;
  const years = useMemo(() => { const s = new Set([...data.recoltes.map((r) => yearOf(r.date)), ...data.ventes.map((v) => yearOf(v.date))]); return Array.from(s).filter(Boolean).sort(); }, [data]);
  const chartData = years.map((y) => ({ annee: y, productionKg: data.recoltes.filter((r) => yearOf(r.date) === y && r.qualite !== "Mauvaise").reduce((s, r) => s + toNum(r.quantiteKg), 0), ventes: data.ventes.filter((v) => yearOf(v.date) === y).reduce((s, v) => s + venteTotalMontant(v), 0) }));
  return (
    <div>
      <SectionTitle>Comparatifs annuels</SectionTitle>
      {years.length === 0 ? <EmptyState text="Pas encore assez d'années de données pour comparer." /> : (
        <>
          <Card style={{ marginBottom: 20 }}>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 14 }}>PRODUCTION TOTALE PAR ANNÉE (KG)</div>
            <div style={{ height: 260 }}><ResponsiveContainer width="100%" height="100%"><LineChart data={chartData} margin={{ top: 10, right: 20, left: 0, bottom: 10 }}><CartesianGrid stroke={C.line} vertical={false} /><XAxis dataKey="annee" tick={axisTick} /><YAxis tick={axisTick} /><Tooltip {...tooltipStyle} /><Line type="monotone" dataKey="productionKg" stroke={C.olive} strokeWidth={2} dot={{ r: 4 }} /></LineChart></ResponsiveContainer></div>
          </Card>
          <Card>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 14 }}>VENTES TOTALES PAR ANNÉE ({devise})</div>
            <div style={{ height: 260 }}><ResponsiveContainer width="100%" height="100%"><LineChart data={chartData} margin={{ top: 10, right: 20, left: 0, bottom: 10 }}><CartesianGrid stroke={C.line} vertical={false} /><XAxis dataKey="annee" tick={axisTick} /><YAxis tick={axisTick} /><Tooltip {...tooltipStyle} formatter={(v) => fmtMoney(v, devise)} /><Line type="monotone" dataKey="ventes" stroke={C.gold} strokeWidth={2} dot={{ r: 4 }} /></LineChart></ResponsiveContainer></div>
          </Card>
        </>
      )}
    </div>
  );
}

const MOIS_TAXES = [
  { m: "08", label: "Août" },
  { m: "09", label: "Septembre" },
  { m: "10", label: "Octobre" },
  { m: "11", label: "Novembre" },
];

function TaxesView({ data }) {
  const devise = data.parametres.devise;
  const years = useMemo(() => { const s = new Set(data.ventes.map((v) => yearOf(v.date))); s.add(String(new Date().getFullYear())); return Array.from(s).filter(Boolean).sort().reverse(); }, [data]);
  const [year, setYear] = useState(years[0]);

  const parMois = MOIS_TAXES.map(({ m, label }) => {
    const ventesMois = data.ventes.filter((v) => v.date && v.date.startsWith(`${year}-${m}`));
    const total = ventesMois.reduce((s, v) => s + venteTotalMontant(v), 0);
    return { label, total, nb: ventesMois.length };
  });
  const totalPeriode = parMois.reduce((s, m) => s + m.total, 0);

  return (
    <div>
      <SectionTitle sub="Total des ventes pour août à novembre — pratique pour indiquer rapidement le chiffre de ventes dans un rapport de taxes, même lorsque ce n'est pas taxable.">Sommaire taxes (août à novembre)</SectionTitle>
      <Field label="ANNÉE"><select style={{ ...inputStyle, maxWidth: 160 }} value={year} onChange={(e) => setYear(e.target.value)}>{years.map((y) => <option key={y} value={y}>{y}</option>)}</select></Field>
      <StatCard label={`Total des ventes — août à novembre ${year}`} value={fmtMoney(totalPeriode, devise)} accent={C.gold} />
      <Card style={{ marginTop: 20 }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 14 }}>DÉTAIL PAR MOIS</div>
        {parMois.map((m, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: `1px solid ${C.line}`, fontSize: 14.5 }}>
            <div>{m.label} {year} <span style={{ color: C.textMuted, fontSize: 12.5 }}>({m.nb} vente{m.nb !== 1 ? "s" : ""})</span></div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{fmtMoney(m.total, devise)}</div>
          </div>
        ))}
      </Card>
    </div>
  );
}

function buildBilanAnnee(data, year) {
  const recoltesAnnee = data.recoltes.filter((r) => yearOf(r.date) === year && r.qualite !== "Mauvaise");
  const productionTotale = recoltesAnnee.reduce((s, r) => s + toNum(r.quantiteKg), 0);
  const productionParCepage = {};
  recoltesAnnee.forEach((r) => { productionParCepage[r.cepageId] = (productionParCepage[r.cepageId] || 0) + toNum(r.quantiteKg); });

  const ventesAnnee = data.ventes.filter((v) => yearOf(v.date) === year);
  const ventesTotal = ventesAnnee.reduce((s, v) => s + venteTotalMontant(v), 0);
  const ventesParCepage = {};
  const ventesParClient = {};
  ventesAnnee.forEach((v) => {
    const client = data.clients.find((c) => c.id === v.clientId);
    const nomClient = client ? client.nom : "?";
    v.lignes.forEach((l) => {
      const montant = ligneMontant(l);
      ventesParClient[nomClient] = (ventesParClient[nomClient] || 0) + montant;
      const produit = data.produits.find((p) => p.id === l.produitId);
      if (produit && produit.categorie === "Raisin frais" && l.cepageId) ventesParCepage[l.cepageId] = (ventesParCepage[l.cepageId] || 0) + montant;
    });
  });

  const rendementRows = buildRendementRows(data).filter((r) => r.annee === year);
  const rendementParCepage = {};
  rendementRows.forEach((r) => {
    if (r.plants == null) return;
    if (!rendementParCepage[r.cepageId]) rendementParCepage[r.cepageId] = { kg: 0, plants: 0 };
    rendementParCepage[r.cepageId].kg += r.kg;
    rendementParCepage[r.cepageId].plants += r.plants;
  });

  return { productionTotale, productionParCepage, ventesTotal, ventesParCepage, ventesParClient, rendementParCepage };
}

function ExportAnnuelView({ data }) {
  const devise = data.parametres.devise;
  const years = useMemo(() => { const s = new Set([...data.recoltes.map((r) => yearOf(r.date)), ...data.ventes.map((v) => yearOf(v.date))]); s.add(String(new Date().getFullYear())); return Array.from(s).filter(Boolean).sort().reverse(); }, [data]);
  const [year, setYear] = useState(years[0]);
  const bilan = useMemo(() => buildBilanAnnee(data, year), [data, year]);
  const cepNom = (id) => (data.cepages.find((c) => c.id === id) || {}).nom || "?";

  const exporterCSV = () => {
    const lignes = [];
    lignes.push(`VitiGest — Bilan de saison ${year}`);
    lignes.push("");
    lignes.push("PRODUCTION PAR CÉPAGE (KG)");
    lignes.push("Cépage,Kg récoltés");
    Object.entries(bilan.productionParCepage).forEach(([id, kg]) => lignes.push(`${cepNom(id)},${kg}`));
    lignes.push(`Total,${bilan.productionTotale}`);
    lignes.push("");
    lignes.push("RENDEMENT PAR CÉPAGE (KG/PLANT)");
    lignes.push("Cépage,Kg récoltés,Nombre de plants,Kg par plant");
    Object.entries(bilan.rendementParCepage).forEach(([id, v]) => lignes.push(`${cepNom(id)},${v.kg},${v.plants},${v.plants ? (v.kg / v.plants).toFixed(3) : ""}`));
    lignes.push("");
    lignes.push("VENTES PAR CÉPAGE (RAISIN FRAIS, $)");
    lignes.push(`Cépage,Montant (${devise})`);
    Object.entries(bilan.ventesParCepage).forEach(([id, m]) => lignes.push(`${cepNom(id)},${m.toFixed(2)}`));
    lignes.push("");
    lignes.push("VENTES PAR CLIENT ($)");
    lignes.push(`Client,Montant (${devise})`);
    Object.entries(bilan.ventesParClient).forEach(([nom, m]) => lignes.push(`${nom},${m.toFixed(2)}`));
    lignes.push("");
    lignes.push(`TOTAL DES VENTES,${bilan.ventesTotal.toFixed(2)}`);
    const csv = lignes.map((l) => l).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `vitigest-bilan-${year}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <div>
      <SectionTitle sub="Résumé de la saison — production, rendement et ventes par cépage et par client. Exportable en PDF (impression) ou en CSV (Excel).">Export annuel</SectionTitle>
      <div className="no-print" style={{ display: "flex", gap: 16, alignItems: "flex-end", flexWrap: "wrap", marginBottom: 20 }}>
        <Field label="ANNÉE"><select style={{ ...inputStyle, maxWidth: 160 }} value={year} onChange={(e) => setYear(e.target.value)}>{years.map((y) => <option key={y} value={y}>{y}</option>)}</select></Field>
        <Btn onClick={() => window.print()}>Imprimer / Enregistrer en PDF</Btn>
        <Btn kind="ghost" onClick={exporterCSV}>Exporter en CSV (Excel)</Btn>
      </div>

      <div className="print-report">
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 22, color: C.parchment, marginBottom: 16 }}>{data.parametres.nomEntreprise || "VitiGest"} — Bilan de saison {year}</div>

        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 20 }}>
          <StatCard label="Production totale" value={fmtKg(bilan.productionTotale)} accent={C.olive} />
          <StatCard label="Ventes totales" value={fmtMoney(bilan.ventesTotal, devise)} accent={C.gold} />
        </div>

        <Card style={{ marginBottom: 20 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 12 }}>PRODUCTION & RENDEMENT PAR CÉPAGE</div>
          {Object.keys(bilan.productionParCepage).length === 0 ? <EmptyState text="Aucune récolte cette année-là." /> : Object.entries(bilan.productionParCepage).map(([id, kg]) => {
            const rend = bilan.rendementParCepage[id];
            return (
              <div key={id} style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: `1px solid ${C.line}`, fontSize: 14.5 }}>
                <div>{cepNom(id)}</div>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{fmtKg(kg)}{rend && rend.plants ? ` · ${(rend.kg / rend.plants).toFixed(3)} kg/plant` : ""}</div>
              </div>
            );
          })}
        </Card>

        <Card style={{ marginBottom: 20 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 12 }}>VENTES PAR CÉPAGE (RAISIN FRAIS)</div>
          {Object.keys(bilan.ventesParCepage).length === 0 ? <EmptyState text="Aucune vente de raisin frais cette année-là." /> : Object.entries(bilan.ventesParCepage).sort((a, b) => b[1] - a[1]).map(([id, m]) => (
            <div key={id} style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: `1px solid ${C.line}`, fontSize: 14.5 }}>
              <div>{cepNom(id)}</div><div style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{fmtMoney(m, devise)}</div>
            </div>
          ))}
        </Card>

        <Card>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.15em", color: C.textMuted, marginBottom: 12 }}>VENTES PAR CLIENT</div>
          {Object.keys(bilan.ventesParClient).length === 0 ? <EmptyState text="Aucune vente cette année-là." /> : Object.entries(bilan.ventesParClient).sort((a, b) => b[1] - a[1]).map(([nom, m]) => (
            <div key={nom} style={{ display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: `1px solid ${C.line}`, fontSize: 14.5 }}>
              <div>{nom}</div><div style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{fmtMoney(m, devise)}</div>
            </div>
          ))}
        </Card>
      </div>
    </div>
  );
}
